# Template: the nginx image runs envsubst on startup, replacing ${PORT} and
# ${API_UPSTREAM} (defaults set in the Dockerfile). nginx's own $variables are
# left untouched because envsubst only substitutes defined environment variables.
server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Reverse proxy API calls to the api service, stripping the /api prefix:
    #   /api/auth/login -> ${API_UPSTREAM}/auth/login
    # The API scopes the refresh cookie to its own /auth path; the browser only
    # sees /api/auth, so the cookie path gets the same prefix back.
    location /api/ {
        proxy_pass ${API_UPSTREAM}/;
        proxy_cookie_path /auth /api/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never cache the SPA entrypoint so new deploys are picked up immediately.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Long-cache fingerprinted static assets.
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
