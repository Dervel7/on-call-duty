# Edge nginx: TLS termination and routing by domain, one server block per clinic.
#
# Template: the nginx image runs envsubst on startup and replaces
# ${CLINIC_X_DOMAIN} with the values from .env. nginx's own $variables are left
# untouched because envsubst only substitutes defined environment variables.
#
# Certificates: one per domain, read from /etc/letsencrypt (the host's CERTS_DIR).
# nginx does not start until every certificate file exists. With certbot on the
# host, issue them once before the first start:
#   certbot certonly --standalone -d clinic-a.example.com   (repeat per domain)
# and renew with the edge stopped, so certbot can use port 80:
#   certbot renew --pre-hook "docker compose -f <this dir>/docker-compose.yml stop edge" \
#                 --post-hook "docker compose -f <this dir>/docker-compose.yml start edge"
#
# This file is included in the http context, so the settings below apply to
# every server block.

server_tokens off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# The web container appends this hop to X-Forwarded-For, and the API trusts
# two hops (TRUST_PROXY_HOPS=2). Overwriting the header here drops any value
# the client sent, so the API sees the real client address.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Plain HTTP: redirect every request to HTTPS.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Unknown domains and bare-IP requests: refuse the TLS handshake.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# --- Clinic A ---
server {
    listen 443 ssl;
    http2 on;
    server_name ${CLINIC_A_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${CLINIC_A_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${CLINIC_A_DOMAIN}/privkey.pem;

    location / {
        proxy_pass http://web-a;
    }
}

