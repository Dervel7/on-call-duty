name: Release

# Tag-driven versioning: push a tag like `v1.2.3` to cut a release.
# - Creates a GitHub Release with auto-generated notes.
# - Builds and publishes the api & web images to GHCR, tagged with the version
#   and `latest`.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # create the GitHub Release
  packages: write # push images to ghcr.io

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-images:
    name: Build & push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image namespace (lowercase)
        id: ns
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.ns.outputs.name }}/api:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.ns.outputs.name }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ghcr.io/${{ steps.ns.outputs.name }}/web:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.ns.outputs.name }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
